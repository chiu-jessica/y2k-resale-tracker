name: Scrape and Load Data

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday at 6am UTC
  workflow_dispatch:      # allows manual trigger from the GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt
      # train_model.py needs scikit-learn/joblib, which aren't in
      # requirements.txt (that file only covers the collect/clean/load steps).
      - run: pip install scikit-learn joblib

      - run: python scraper.py
      - run: python etl.py

      - name: Write GCP key
        run: echo '${{ secrets.GCP_KEY_JSON }}' > gcp-key.json

      - name: Load to BigQuery
        run: python load_to_bigquery.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp-key.json
          BIGQUERY_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID }}

      - name: Retrain model
        run: python backend/train_model.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp-key.json
          BIGQUERY_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID }}
          # train_model.py requires these explicitly (load_to_bigquery.py
          # falls back to the same values as defaults, so it didn't need
          # them set here before).
          BIGQUERY_DATASET: y2k_resale
          BIGQUERY_TABLE: listings
